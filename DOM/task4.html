<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" id="first">
    <br>

    <input type="number" name="" id="second">
    <br>
    <button onclick="add()">
        Add
    </button>

    <button onclick="sub()">
        Sub
    </button>
    <button onclick="mul()">
        multiply
    </button>
     <button onclick="div()">
       Devision
    </button>
    <h1 id="h1"></h1>
    <script>

        let res = document.getElementById("h1")

        function add() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);
            let plus = first + second
            res.innerText = plus;
        }
        function sub() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            res.innerText = first - second;
        }
        function mul() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            res.innerText = first * second;
        }

        function div() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);
            if(second==0){
                res.innerText="can devide by Zero"
                return 
            }

            res.innerText = first / second;
        }


    </script>
</body>

</html>
