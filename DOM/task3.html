<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" id="first">
    <br>
    <input type="number" name="" id="second">
    <button onclick="add()">
        Add
    </button>
    <h1 id="h1"></h1>
    <script>

        let res = document.getElementById("h1")
        function add() {
            console.log(typeof document.getElementById("first").value);
            

            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            let plus = first + second



            res.innerText = plus;


        }

    </script>
</body>

</html>
